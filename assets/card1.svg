<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-label="Pipelines people trust">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#042a3a"/><stop offset="1" stop-color="#001018"/></linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4103"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
    <style>.mono{font-family:'Consolas',monospace;}.sans{font-family:'Segoe UI',Arial,sans-serif;}</style>
  </defs>
  <rect width="580" height="260" rx="20" fill="url(#c1)" stroke="#0d4255" stroke-width="2"/>
  <text x="28" y="42" class="mono" font-size="13" fill="#ff8a5c">// DATA ENGINEERING</text>
  <text x="28" y="80" class="sans" font-size="26" font-weight="800" fill="#eaf2f5">Pipelines people trust</text>
  <text x="28" y="112" class="sans" font-size="14" fill="#8aa4b0">Python ETL/ELT on Airflow — ingest, validate,</text>
  <text x="28" y="132" class="sans" font-size="14" fill="#8aa4b0">transform and schedule, with data-quality checks.</text>

  <!-- pipeline diagram -->
  <g transform="translate(28,170)">
    <rect x="0" y="0" width="90" height="52" rx="10" fill="#001621" stroke="#FF4103" stroke-width="2"/>
    <text x="45" y="31" text-anchor="middle" class="mono" font-size="12" fill="#eaf2f5">Source</text>
    <line x1="90" y1="26" x2="150" y2="26" stroke="#ff6a3d" stroke-width="3"/>
    <rect x="150" y="0" width="90" height="52" rx="10" fill="#001621" stroke="#ff6a3d" stroke-width="2"/>
    <text x="195" y="31" text-anchor="middle" class="mono" font-size="12" fill="#eaf2f5">Airflow</text>
    <line x1="240" y1="26" x2="300" y2="26" stroke="#ff6a3d" stroke-width="3"/>
    <rect x="300" y="0" width="90" height="52" rx="10" fill="#001621" stroke="#ff8a5c" stroke-width="2"/>
    <text x="345" y="31" text-anchor="middle" class="mono" font-size="12" fill="#eaf2f5">Warehouse</text>
    <line x1="390" y1="26" x2="450" y2="26" stroke="#ff6a3d" stroke-width="3"/>
    <rect x="450" y="0" width="90" height="52" rx="10" fill="url(#a1)"/>
    <text x="495" y="31" text-anchor="middle" class="mono" font-size="12" fill="#fff">Insights</text>
  </g>
</svg>
