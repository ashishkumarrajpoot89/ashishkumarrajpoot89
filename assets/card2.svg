<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-label="Learning in motion">
  <defs>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#042a3a"/><stop offset="1" stop-color="#001018"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4103"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
    <style>.mono{font-family:'Consolas',monospace;}.sans{font-family:'Segoe UI',Arial,sans-serif;}</style>
  </defs>
  <rect width="580" height="260" rx="20" fill="url(#c2)" stroke="#0d4255" stroke-width="2"/>
  <text x="28" y="42" class="mono" font-size="13" fill="#ff8a5c">// CURRENTLY LEARNING</text>
  <text x="28" y="80" class="sans" font-size="26" font-weight="800" fill="#eaf2f5">Learning in motion</text>
  <text x="28" y="112" class="sans" font-size="14" fill="#8aa4b0">Moving into AI-focused data engineering —</text>
  <text x="28" y="132" class="sans" font-size="14" fill="#8aa4b0">RAG, MCP, LangGraph &amp; agentic systems.</text>

  <!-- progress bars -->
  <g transform="translate(28,160)" class="sans" font-size="13">
    <text x="0" y="12" fill="#eaf2f5">LangChain / LangGraph</text>
    <rect x="300" y="2" width="240" height="12" rx="6" fill="#001621" stroke="#0d4255"/>
    <rect x="300" y="2" width="204" height="12" rx="6" fill="url(#a2)"/>
    <text x="0" y="42" fill="#eaf2f5">RAG &amp; Agentic RAG</text>
    <rect x="300" y="32" width="240" height="12" rx="6" fill="#001621" stroke="#0d4255"/>
    <rect x="300" y="32" width="180" height="12" rx="6" fill="url(#a2)"/>
    <text x="0" y="72" fill="#eaf2f5">MCP / Agents SDK</text>
    <rect x="300" y="62" width="240" height="12" rx="6" fill="#001621" stroke="#0d4255"/>
    <rect x="300" y="62" width="150" height="12" rx="6" fill="url(#a2)"/>
  </g>
</svg>
