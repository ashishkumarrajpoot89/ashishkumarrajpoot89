<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Tools I build with — animated orbital tech map">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4103"/><stop offset="1" stop-color="#b83308"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4103" stop-opacity="0.6"/><stop offset="1" stop-color="#0d4255" stop-opacity="0.3"/>
    </linearGradient>
    <style>
      .mono{font-family:'Consolas',monospace;}.sans{font-family:'Segoe UI',Arial,sans-serif;}
      .node{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:700;}
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbitRev { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
      .o1{animation:orbit 16s linear infinite;transform-origin:380px 250px;}
      .o2{animation:orbit 22s linear infinite;transform-origin:380px 250px;}
      .o3{animation:orbitRev 13s linear infinite;transform-origin:380px 250px;}
      .ringspin{animation:orbit 40s linear infinite;transform-origin:380px 250px;}
      .ringspin2{animation:orbitRev 30s linear infinite;transform-origin:380px 250px;}
      .corepulse{animation:pulse 3s ease-in-out infinite;transform-origin:380px 250px;}
      /* counter-rotate labels so text stays upright */
      .lab1{animation:orbitRev 16s linear infinite;transform-origin:center;}
      .lab2{animation:orbitRev 22s linear infinite;transform-origin:center;}
      .lab3{animation:orbit 13s linear infinite;transform-origin:center;}
    </style>
  </defs>

  <rect width="760" height="420" rx="20" fill="#001621" stroke="#0d4255" stroke-width="2"/>
  <text x="30" y="44" class="mono" font-size="14" fill="#ff8a5c">// TECH STACK</text>
  <text x="30" y="76" class="sans" font-size="26" font-weight="800" fill="#eaf2f5">Tools I build with</text>

  <!-- rotating rings -->
  <ellipse cx="380" cy="250" rx="300" ry="118" fill="none" stroke="url(#ring)" stroke-width="1.5" class="ringspin"/>
  <ellipse cx="380" cy="250" rx="210" ry="80"  fill="none" stroke="url(#ring)" stroke-width="1.5" class="ringspin2"/>
  <ellipse cx="380" cy="250" rx="120" ry="44"  fill="none" stroke="url(#ring)" stroke-width="1.5" class="ringspin"/>

  <!-- core -->
  <g class="corepulse">
    <circle cx="380" cy="250" r="40" fill="url(#core)"/>
    <circle cx="380" cy="250" r="40" fill="none" stroke="#ff8a5c" stroke-width="2"/>
    <text x="380" y="259" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#fff">&lt;/&gt;</text>
  </g>

  <!-- OUTER orbit group (nodes placed on rx=300) -->
  <g class="o1">
    <g class="node">
      <g transform="translate(80,250)"><g class="lab1"><circle r="22" fill="#042a3a" stroke="#FF4103" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Py</text></g></g>
      <g transform="translate(680,250)"><g class="lab1"><circle r="22" fill="#042a3a" stroke="#FF4103" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">SQL</text></g></g>
    </g>
  </g>

  <!-- MIDDLE orbit group (rx=210) -->
  <g class="o2">
    <g class="node">
      <g transform="translate(170,250)"><g class="lab2"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Air</text></g></g>
      <g transform="translate(590,250)"><g class="lab2"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Spk</text></g></g>
      <g transform="translate(380,170)"><g class="lab2"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">AWS</text></g></g>
      <g transform="translate(380,330)"><g class="lab2"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Kfk</text></g></g>
    </g>
  </g>

  <!-- INNER orbit group (rx=120) -->
  <g class="o3">
    <g class="node">
      <g transform="translate(260,250)"><g class="lab3"><circle r="17" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">dbt</text></g></g>
      <g transform="translate(500,250)"><g class="lab3"><circle r="17" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">API</text></g></g>
      <g transform="translate(380,206)"><g class="lab3"><circle r="17" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Dkr</text></g></g>
    </g>
  </g>
</svg>
