<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Tools I build with — orbital tech map">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4103"/>
      <stop offset="1" stop-color="#b83308"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4103" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0d4255" stop-opacity="0.3"/>
    </linearGradient>
    <style>.mono{font-family:'Consolas','SF Mono',monospace;}.sans{font-family:'Segoe UI',Arial,sans-serif;}</style>
  </defs>

  <rect width="760" height="420" rx="20" fill="#001621" stroke="#0d4255" stroke-width="2"/>
  <text x="30" y="44" class="mono" font-size="14" fill="#ff8a5c">// TECH STACK</text>
  <text x="30" y="76" class="sans" font-size="26" font-weight="800" fill="#eaf2f5">Tools I build with</text>

  <!-- orbit center -->
  <g transform="translate(380,250)">
    <ellipse cx="0" cy="0" rx="300" ry="120" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="210" ry="80" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="120" ry="46" fill="none" stroke="url(#ring)" stroke-width="1.5"/>

    <!-- core -->
    <circle cx="0" cy="0" r="40" fill="url(#core)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ff8a5c" stroke-width="2"/>
    <text x="0" y="9" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#fff">&lt;/&gt;</text>

    <!-- orbiting nodes -->
    <g class="sans" font-size="12" font-weight="700">
      <g transform="translate(-300,0)"><circle r="22" fill="#042a3a" stroke="#FF4103" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Py</text></g>
      <g transform="translate(300,0)"><circle r="22" fill="#042a3a" stroke="#FF4103" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">SQL</text></g>
      <g transform="translate(-210,-80)"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Air</text></g>
      <g transform="translate(210,-80)"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Spk</text></g>
      <g transform="translate(-210,80)"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">AWS</text></g>
      <g transform="translate(210,80)"><circle r="20" fill="#042a3a" stroke="#ff6a3d" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Kfk</text></g>
      <g transform="translate(-120,-46)"><circle r="18" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">dbt</text></g>
      <g transform="translate(120,-46)"><circle r="18" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">API</text></g>
      <g transform="translate(0,120)"><circle r="18" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">SQL</text></g>
      <g transform="translate(0,-120)"><circle r="18" fill="#042a3a" stroke="#ff8a5c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#eaf2f5">Dkr</text></g>
    </g>
  </g>
</svg>
